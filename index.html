<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions attempting to intercept window.fetch
      try {
        const originalFetch = window.fetch ? window.fetch.bind(window) : null;
        let activeFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return activeFetch;
          },
          set(val) {
            activeFetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback gracefully if property cannot be redefined
      }
    </script>
